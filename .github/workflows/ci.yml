name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      # The repository dogfoods its own plugin: issues.json here is real tracking data, not a
      # fixture. Reading it back through the shipped tracker is the cheapest guarantee that a
      # change to the plugin has not broken the one file every consumer project keeps.
      - name: Read this project's tracker through the plugin
        run: node scripts/issue-manager.mjs --get-all --page-size 1
